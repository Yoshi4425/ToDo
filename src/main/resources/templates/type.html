<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToDoリスト</title>
</head>

<body>
	<h1>種別設定</h1><hr>

   
    <!-- ToDo一覧 -->
	<h2>種別一覧
		<button type="button" onclick="location.href='/'" 
			style="font-size: 14px; font-weight: normal; margin-left: 20px; display:inline"> 
			タスク一覧に戻る
		</button>
	</h2>
	
	<form action="/addType" method="post">
	    <input type="text" name="name" style="width: 25em;"  maxlength="20" placeholder="種別名を入力（20文字まで）" required>
		<button type="submit">＋追加</button>
	</form>
	
	<br>

    <table>
		<tbody>
			<tr th:each="type : ${types}">
				
				<!-- 種別名 -->
				<td th:text = "・ + ${type.name}" style = "margin-left: 20px;"></td>
			
				<!-- 操作 -->
				<td>		
					<button type="button" class="editType"
						th:data-id="${type.id}"
						th:data-name="${type.name}"
					> 編集 </button>
								
					<form action="/deleteType" method="post" style="display:inline">
					    <input type="hidden" name="id" th:value="${type.id}">
					    <button type="submit">削除</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
	
	<!-- 編集ポップアップ -->
	<dialog id="typeDialog">
	    <h2>種別の編集</h2>

	    <form id="typeForm" method="post">
	        <input type="hidden" id="id" name="id">
	        <input type="text" id="name" name="name" style="width: 25em;" maxlength="20" 
			placeholder="種別名を変更（20文字まで）" required>
	
	        <button type="submit">保存</button>
	        <button type="button" id="cancelButton">キャンセル</button>
	    </form>
	</dialog>

	<script>
		const dialog = document.getElementById("typeDialog");
		const form = document.getElementById("typeForm");
		
		
		// 編集ボタン
		document.querySelectorAll(".editType").forEach(button => {
		    button.addEventListener("click", () => {
		        // タスクの情報を取得
		        document.getElementById("id").value = button.dataset.id;
		        document.getElementById("name").value = button.dataset.name;
		        form.action = "/editType";
		        dialog.showModal();
		    });
		});
		
		// キャンセルボタン
		document.getElementById("cancelButton").addEventListener("click", () => {
		    dialog.close();
		});
	</script>
	
	<!-- エラー用ポップアップ -->
	<dialog id="errorDialog" th:if="${errorMessage != null}">
	    <p th:text="${errorMessage}"></p>
		<button type="button" onclick="location.href='/setType'">OK</button>
	</dialog>

	<script th:if="${errorMessage != null}">
	    document.getElementById("errorDialog").showModal();
	</script>
	
</body>
</html>
