<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToDoリスト</title>
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/type.css}">
	<script th:src="@{/js/common.js}" defer></script>
	<script th:src="@{/js/type.js}" defer></script>
</head>

<body>
	<!-- ヘッダー -->
	<div class="pageHeader">
		<h1>種別設定</h1>
		<div class="userArea">
		    <span th:text="'ユーザー名：' + ${username}" class="username"></span>
		    <form th:action="@{/logout}" method="post" class="logoutForm">
				  <button type="submit">ログアウト</button>
		    </form>
		</div>
	</div>
	<hr>

   
    <!-- 種別の一覧表示 -->
	<h2>種別一覧
		<button type="button" onclick="location.href='/'" class="headingButton"> 
			タスク一覧に戻る
		</button>
	</h2>
	
	<form th:action="@{/addType}" method="post">
	    <input type="text" name="name" style="width: 25em;"  maxlength="20" placeholder="種別名を入力（20文字まで）" required>
		<button type="submit">＋追加</button>
	</form>
	
	<br>
    <table>
		<tbody>
			<tr th:each="type : ${types}">
				
				<!-- 種別名 -->
				<td th:text = "'・' + ${type.name}" class="typeName"></td>
			
				<!-- 操作 -->
				<td>		
					<button type="button" class="editType"
						th:data-id="${type.id}"	th:data-name="${type.name}">
						編集 </button>
								
					<form th:action="@{/deleteType}" method="post" class="inlineForm">
					    <input type="hidden" name="id" th:value="${type.id}">
					    <button type="submit">削除</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>
	
	<!-- 種別編集用ダイアログ -->
	<dialog id="typeDialog">
	    <h2>種別の編集</h2>

	    <form id="typeForm" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
	        <input type="hidden" id="id" name="id">
	        <input type="text" id="name" name="name" style="width: 25em;" maxlength="20" 
				placeholder="種別名を変更（20文字まで）" required>
	
	        <button type="submit">保存</button>
	        <button type="button" class="closeDialog">キャンセル</button>
	    </form>
	</dialog>
	
	<!-- エラーメッセージ用ダイアログ -->
	<dialog id="errorDialog" th:if="${errorMessage != null}">
	    <p th:text="${errorMessage}"></p>
		<button type="button" onclick="location.href='/setType'">OK</button>
	</dialog>

</body>
</html>
