<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8" xmlns:th="http://www.thymeleaf.org">
    <title>ToDoリスト</title>
	<style>
		.memoArea {
		    display: flex;
		    align-items: flex-start;
		    gap: 5px;
		}

		#memo {
		    width: 42em;
		    height: 6em;
		    box-sizing: border-box;
		}

		.memoSide {
		    display: flex;
		    flex-direction: column;
		    align-items: center;
		    gap: 5px;
			align-self: flex-end;
		}

		#memoCount {
		    margin: 0;
		    white-space: nowrap;
		}
		
		table th,
		table td {
		    padding: 10px 20px;
		}
	</style>
</head>
<body>
	<div style="display: flex; justify-content: space-between; align-items:center;">
		<h1>ToDoリスト</h1>
		<div>
		    <span th:text="'ユーザー名：' + ${username}" style="display: flex; margin-right: 20px;"></span>
		    <form th:action="@{/logout}" method="post" style="display: flex; margin-left: 20px;">
		        <button type="submit">ログアウト</button>
		    </form>
		</div>
	</div>
	<hr>

   
    <!-- ToDo一覧 -->
	<h2>タスク一覧
		<button type="button" id="addButton" style="font-size: 14px; font-weight: normal; margin-left: 20px;">
			＋ 追加</button>
		<button type="button" onclick="location.href='/setType'" 
			style="font-size: 14px; font-weight: normal; margin-left: 20px;">
			種別を設定	</button>
	</h2>

    <table>
		<thread>
			<tr>
				<th>完了</th>
				<th>タスク</th>
				<th>種別</th>
				<th>締切</th>
				<th>メモ</th>
				<th>操作</th>
			</tr>
		</thread>
		
		<tbody>
			<tr th:each="task : ${tasks}">
				
				<!-- 完了チェックボックス -->
				<td style="text-align: center;">
					<form th:action="@{/complete}" method="post" style="display:inline">
					    <input type="hidden" name="id" th:value="${task.id}">
						<input type="checkbox" th:checked="${task.complete}"
						       onchange="this.form.submit()">
					</form>
				</td>
				
				<!-- タスク名 -->
				<td  style="text-align: center;" th:text = "${task.title}"
					th:style= "${task.complete} ? 'text-decoration: line-through' :''">
				</td>
				
				<!-- 種別 -->
				<td  style="text-align: center;" th:text = "${task.type != null ? task.type.name : '未設定'}"></td>
		
				<!-- 締切日 -->
				<td  style="text-align: center;" th:text="${task.deadline != null
					? #temporals.format(task.deadline, 'yyyy/MM/dd (HH:mm)'): ''}">
				</td>
				
				<!-- memo表示 -->
				<td style="text-align: center;">
					<button type="button" class="memoButton"
						th:data-title="${task.title}"
						th:data-memo="${task.memo}"
					> メモ表示 </button>
				</td>
					
				<!-- 操作 -->
				<td style="text-align: center;">
							
					<button type="button" class="editButton"
						th:data-id="${task.id}"
						th:data-title="${task.title}"
						th:data-type-id="${task.type != null ? task.type.id : ''}"
						th:data-deadline="${task.deadline}"
						th:data-memo="${task.memo}"
					> 編集 </button>
					
					<form th:action="@{/delete}" method="post" style="display:inline">
					    <input type="hidden" name="id" th:value="${task.id}">
					    <button type="submit">削除</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>

	<!-- 編集ポップアップ -->
	<dialog id="taskDialog">
		
		<div style="display: flex; justify-content: space-between; align-items: center;">
		    <h2 id="dialogTitle">タスクの追加・編集
					<button type="button" onclick="location.href='/setType'" 
						style="font-size: 14px; font-weight: normal; margin-left: 20px;">
						種別を設定	
					</button>
			</h2>
			
			<div style="display: flex; gap: 5px;">
			        <button type="submit" form="taskForm" id="saveButton">保存</button>
			        <button type="button" id="cancelButton">キャンセル</button>
			    </div>
			</div>

	    <form id="taskForm" method="post">
			<input type="hidden"
			th:name="${_csrf.parameterName}"
			th:value="${_csrf.token}">

	        <input type="hidden" id="id" name="id">

	        <label for="title">タスク</label>
	        <input type="text" id="title" name="title" style="width: 35em;"
			 maxlength="30" placeholder="タスクを入力（30文字まで）" required>
			
			 <br>
			<label for="type">種別</label>
			<select name="typeId" id="typeId"  style="width: 25em;" required>
			    <option value="" disabled hidden  th:selected="${typeId == null}" >
				種別を選択</option>
				<option th:each="type : ${types}"
						th:value="${type.id}"
				        th:text="${type.name}">
				</option>
			</select>
			
			<label for="deadline">締切日</label>
			<input type="datetime-local" name="deadline" id="deadline">
			
			<br><br>
			<div class="memoArea">
				<label for="memo">メモ</label>
				<textarea
				    id="memo" name="memo" placeholder="メモを入力してください（200文字まで）">
				</textarea>
				<div class="memoSide">
				    <p id="memoCount"></p>
				    <button type="button" id="clearMemo">クリア</button>
				</div>
			</div>
	    </form>
	</dialog>
	
	<!-- メモ表示ポップアップ -->
	<dialog id="memoDialog" rows="4" style="width: 50em;">		
		<h2 id="memoTitle"></h2>
		<p id="memoText"></p>
		<div style="text-align: right;">
			<button type="button" id="memoCancelButton">閉じる</button>
		</div>
	</dialog>
		
	<script>
		const dialog = document.getElementById("taskDialog");
		const form = document.getElementById("taskForm");
		
		// 追加ボタン
		document.getElementById("addButton").addEventListener("click", () => {
		    form.reset();
		    document.getElementById("id").value = -1;
			document.getElementById("memo").value = "";
		    form.action = "/add";
			checkMemoLength();
			dialog.showModal();
		});
		
		// 編集ボタン
		document.querySelectorAll(".editButton").forEach(button => {
		    button.addEventListener("click", () => {
		        // タスクの情報を取得
		        document.getElementById("id").value = button.dataset.id;
		        document.getElementById("title").value = button.dataset.title;
		        document.getElementById("typeId").value = button.dataset.typeId;
		        document.getElementById("deadline").value = button.dataset.deadline || "";
				document.getElementById("memo").value = button.dataset.memo || "";
				// 文字数を反映
				checkMemoLength();

		        form.action = "/edit";

		        dialog.showModal();
		    });
		});
		
		// キャンセルボタン
		document.getElementById("cancelButton").addEventListener("click", () => {
		    dialog.close();
		});
		
		// メモクリアボタン
		document.getElementById("clearMemo").addEventListener("click", () => {
		    memo.value = "";
		    checkMemoLength();
		});
		
		// メモ表示ボタン
		document.querySelectorAll(".memoButton").forEach(button => {
		   	button.addEventListener("click", () => {
			// タスクの情報を取得
			document.getElementById("memoTitle").textContent = button.dataset.title + " のメモ";
			document.getElementById("memoText").textContent = button.dataset.memo || "（メモ内容なし）";

			document.getElementById("memoDialog").showModal();
			});
		});
		// キャンセルボタン
		document.getElementById("memoCancelButton").addEventListener("click", () => {
		    document.getElementById("memoDialog").close();
		});
	</script>
	
	<script>
		const memo = document.getElementById("memo");
		const memoCount = document.getElementById("memoCount");
		const saveButton = document.getElementById("saveButton");
		const maxLength = 200;
	
		// 文字数をチェックする関数
		function checkMemoLength() {
		    const length = memo.value.length;
		
		    memoCount.textContent = `${length} / ${maxLength}文字`;
		    if (length > maxLength) {
		       	memoCount.style.color = "red";
		       	saveButton.disabled = true;
			} else {
			    memoCount.style.color = "";
			    saveButton.disabled = false;
			}
		}
		// 入力中にチェック
		memo.addEventListener("input", checkMemoLength);
	</script>
	
	<!-- エラー用ポップアップ -->
	<dialog id="errorDialog" th:if="${errorMessage != null}">
	    <p th:text="${errorMessage}"></p>
		<button type="button" onclick="location.href='/'">OK</button>
	</dialog>

	<script th:if="${errorMessage != null}">
	    document.getElementById("errorDialog").showModal();
	</script>
</body>

</html>
