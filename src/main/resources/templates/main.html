<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>ToDoリスト</title>
	
	<!-- css,jsの読み込み -->
	<link rel="stylesheet" th:href="@{/css/common.css}">
	<link rel="stylesheet" th:href="@{/css/main.css}">
	<script th:src="@{/js/common.js}" defer></script>
	<script th:src="@{/js/main.js}" defer></script>
</head>

<body>
	<!-- ヘッダー -->
	<div class="pageHeader">
		<h1>ToDoリスト</h1>
		
		<!-- ユーザー操作 -->	
		<div class="userArea">
		    <span th:text="'ユーザー名：' + ${username}" class="username"></span>
		    <form th:action="@{/logout}" method="post" class="logoutForm">
		        <button type="submit">ログアウト</button>
		    </form>
		</div>
	</div>
	<hr>

   
    <!-- タスク一覧表示 -->
	<h2>タスク一覧
		<button type="button" id="addButton" class="headingButton">
			＋ 追加</button>
		<button type="button" onclick="location.href='/setType'" 
			class="headingButton"> 種別を設定	</button>
	</h2>

	<!-- タスク一覧の各要素 -->
    <table>
		<thead>
			<tr>
				<th>完了</th>
				<th>タスク</th>
				<th>種別</th>
				<th>締切</th>
				<th>メモ</th>
				<th>操作</th>
			</tr>
		</thead>
		
		<!-- 各タスクのデータ、操作 -->
		<tbody>
			<tr th:each="task : ${tasks}">
				
				<!-- 完了チェックボックス -->
				<td class="center">
					<form th:action="@{/complete}" method="post" class="inlineForm">
					    <input type="hidden" name="id" th:value="${task.id}">
						<input type="checkbox" th:checked="${task.complete}"
						       onchange="this.form.submit()">
					</form>
				</td>
				
				<!-- タスク名 -->
				<td  class="center" th:text = "${task.title}"
					th:style= "${task.complete} ? 'text-decoration: line-through' :''">
				</td>
				
				<!-- 種別 -->
				<td  class="center" th:text = "${task.type != null ? task.type.name : '未設定'}"></td>
		
				<!-- 締切日 -->
				<td  class="center" th:text="${task.deadline != null
					? #temporals.format(task.deadline, 'yyyy/MM/dd (HH:mm)'): ''}">
				</td>
				
				<!-- memo表示 -->
				<td class="center">
					<button type="button" class="memoButton"
						th:data-title="${task.title}" th:data-memo="${task.memo}">
						 メモ表示 </button>
				</td>
					
				<!-- 操作 -->
				<td class="center">
						
					<button type="button" class="editButton"
						th:data-id="${task.id}"
						th:data-title="${task.title}"
						th:data-type-id="${task.type != null ? task.type.id : ''}"
						th:data-deadline="${task.deadline}"
						th:data-memo="${task.memo}">
						 編集 </button>
					
					<form th:action="@{/delete}" method="post" class="inlineForm">
					    <input type="hidden" name="id" th:value="${task.id}">
					    <button type="submit">削除</button>
					</form>
				</td>
			</tr>
		</tbody>
	</table>

	<!-- タスク追加・編集用ダイアログ -->
	<dialog id="taskDialog">
		
		<!-- ダイアログのヘッダー -->
		<div class="dialogHeader">
		    <h2 id="dialogTitle">タスクの追加・編集
					<button type="button" onclick="location.href='/setType'" 
						class="headingButton">
						種別を設定	
					</button>
			</h2>
			
			<div class="dialogButtons">
			        <button type="submit" form="taskForm" id="saveButton">保存</button>
			        <button type="button" class="closeDialog">キャンセル</button>
			</div>
		</div>

		<!-- タスク入力フォーム -->
	    <form id="taskForm" method="post">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
	        <input type="hidden" id="id" name="id">

	        <label for="title">タスク</label>
	        <input type="text" id="title" name="title" style="width: 35em;"
			 maxlength="30" placeholder="タスクを入力（30文字まで）" required>
			
			 <br>
			<label for="typeId">種別</label>
			<select name="typeId" id="typeId"  style="width: 25em;" required>
			    <option value="" disabled hidden  th:selected="${typeId == null}" >
				  	種別を選択</option>
				<option th:each="type : ${types}" 
					th:value="${type.id}" th:text="${type.name}">
				</option>
			</select>
			
			<label for="deadline">締切日</label>
			<input type="datetime-local" name="deadline" id="deadline">
			
			<br><br>
			<div class="memoArea">
				<label for="memo">メモ</label>
				<textarea id="memo" name="memo" 
					placeholder="メモを入力してください（200文字まで）">
				</textarea>
				<div class="memoSide">
				    <p id="memoCount"></p>
				    <button type="button" id="clearMemo">クリア</button>
				</div>
			</div>
	    </form>
	</dialog>
	
	<!-- メモ表示用ダイアログ -->
	<dialog id="memoDialog" rows="4" style="width: 50em;">		
		<h2 id="memoTitle"></h2>
		<p id="memoText"></p>
		<div class="memoDialogFooter">
			<button type="button" class="closeDialog">閉じる</button>
		</div>
	</dialog>
	
	<!-- エラーメッセージ用ダイアログ -->
		<!-- ダイアログの生成をifで制御 -->
	<dialog id="errorDialog" th:if="${errorMessage != null}">
	    <p th:text="${errorMessage}"></p>
		<button type="button" onclick="location.href='/'">OK</button>
	</dialog>
	
</body>

</html>
